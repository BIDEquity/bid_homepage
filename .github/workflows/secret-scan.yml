name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the scan fails on a planted secret
        run: bash .github/scripts/gitleaks-scan.test.sh

      - name: Scan the commits in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/gitleaks-scan.sh --mode pr --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Scan the tree
        if: github.event_name == 'push'
        run: bash .github/scripts/gitleaks-scan.sh --mode tree
